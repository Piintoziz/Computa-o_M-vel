name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  dio: ^5.3.2
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  firebase_database: ^11.3.7
  firebase_storage: ^12.0.1
  
  google_sign_in: 6.2.2
  fl_chart: ^0.71.0
  flutter_map: ^7.0.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
  - assets/images/

flutter_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#2A815E"


flutter_native_splash:
  color: "#2A815E"
  background_image: "assets/images/splash_screen.png"
  background_image_android: "assets/images/splash_screen.png"
  android: true
  
  android_12:
    color: "#2A815E"
    background_image: "assets/images/splash_screen.png"
    background_image_android: "assets/images/splash_screen.png"